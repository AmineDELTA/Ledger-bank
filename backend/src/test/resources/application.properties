# Test Application Configuration
spring.application.name=core-banking-test

# Isolated in-memory H2 database with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:core_banking_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL generation for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Flyway migrations against the test database
spring.flyway.enabled=false
spring.sql.init.mode=never

# Test logging output redirected to target directory
logging.file.name=target/logs/test-audit.log

# Actuator Health Configuration for tests
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.redis.enabled=false
