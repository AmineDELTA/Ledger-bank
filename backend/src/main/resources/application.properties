spring.application.name=core-banking

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/core_banking
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never

logging.file.name=logs/audit.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} requestId=%X{requestId} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} requestId=%X{requestId} %-5level %logger{36} - %msg%n
spring.data.redis.host=localhost
spring.data.redis.port=6379